<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automotive IT – Demo-Quiz</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e7dc;color:#252b24;font:16px/1.55 system-ui,sans-serif}header{background:#303b29;color:white;padding:24px}header div,main{max-width:680px;margin:auto}h1{font-size:26px;margin:6px 0}small{letter-spacing:1px}main{padding:20px}section{background:#fffef8;border:1px solid #c9cbbd;border-radius:14px;padding:24px;box-shadow:0 6px 20px #0001}h2{font-size:21px}button{font:inherit;cursor:pointer;border-radius:8px;padding:13px 16px;border:1px solid #a7ad9d;background:#f5f5ed;color:#252b24;text-align:left;width:100%;margin:6px 0}button.selected{background:#dbe3cb;border:2px solid #465a32}button.primary{background:#465a32;color:white;text-align:center;font-weight:600;margin-top:18px}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #8c9b5b;outline-offset:3px}progress{width:100%;accent-color:#465a32}footer{font-size:12px;color:#555;margin:18px 0} .level{font-size:40px;font-weight:750;color:#465a32}</style></head><body><header><div><small>ANGEWANDTE FORSCHUNG · DEMO</small><h1>Automotive IT-Sicherheit</h1>QR-Einstieg an der Fahrertür</div></header><main><section id="panel"></section><footer>Demonstrationsprototyp · Hochschule Hof. Kein offizielles Angebot der Bundeswehr. Keine personenbezogenen Daten werden durch das Quiz erhoben oder gespeichert.</footer></main><script>const questions=[["Du möchtest dein privates Smartphone während einer Dienstfahrt aufladen. Welche Möglichkeit reduziert das Risiko einer unbeabsichtigten Datenübertragung?", ["Das Smartphone über einen beliebigen USB-Anschluss verbinden.", "Das Smartphone während des Ladens stummschalten.", "Ein reines Ladekabel ohne Datenübertragung verwenden.", "Die Bildschirmhelligkeit des Smartphones reduzieren."], 2], ["Ein Dienstwagen bietet die Möglichkeit, sich mit einem öffentlichen WLAN zu verbinden. Welches Sicherheitsrisiko kann dabei entstehen?", ["Unbefugte könnten versuchen, ungeschützte Daten abzufangen.", "Die GPS-Genauigkeit wird automatisch reduziert.", "Gespeicherte Fahrzeugdaten werden automatisch gelöscht.", "Die Bluetooth-Verbindung wird dauerhaft deaktiviert."], 0], ["Eine externe App bietet zusätzliche Funktionen für einen Dienstwagen und fordert Zugriff auf Standort- und Fahrzeugdaten. Welches Sicherheitsrisiko besteht dabei?", ["Die App kann ausschließlich öffentlich verfügbare Informationen abrufen.", "Der Zugriff ist grundsätzlich sicher, wenn die App kostenlos ist.", "Die Fahrzeugdaten werden automatisch anonymisiert.", "Sensible Standort- und Fahrzeugdaten könnten unbefugt gesammelt oder weitergegeben werden."], 3], ["Ein Dienstwagen verfügt über einen internetbasierten Sprachassistenten. Welches Datenschutzrisiko kann bei vertraulichen Gesprächen im Fahrzeug entstehen?", ["Sprachaufnahmen werden grundsätzlich nur lokal gespeichert.", "Gesprächsinhalte könnten unbeabsichtigt erfasst und an externe Server übertragen werden.", "Sprachdaten werden ausschließlich für die Navigation verwendet.", "Bei ausgeschaltetem Radio ist auch das Mikrofon automatisch deaktiviert."], 1], ["Moderne Fahrzeuge nutzen interne Kommunikationsnetzwerke wie den CAN-Bus (Controller Area Network). Welches Sicherheitsrisiko besteht, wenn Nachrichten innerhalb dieses Netzwerks nicht ausreichend auf ihre Echtheit geprüft werden?", ["Die Kommunikation zwischen den Steuergeräten wird automatisch verschlüsselt.", "Das Fahrzeug verliert ausschließlich seine Internetverbindung.", "Manipulierte Nachrichten könnten von Steuergeräten als gültige Befehle interpretiert werden.", "Die Kommunikation zwischen den Steuergeräten wird grundsätzlich unterbrochen."], 2]];let i=0,score=0,selected=null,options=[];const panel=document.getElementById('panel');function shuffle(a){for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function intro(){panel.innerHTML='<h2>Wie gut kennst du dich mit IT-Sicherheit im Dienstwagen aus?</h2><p>Beantworte fünf Fragen. Pro Frage ist genau eine Antwort richtig. Am Ende erhältst du eine Einschätzung deines Wissensstands.</p><button class="primary" onclick="start()">Quiz starten</button>'}function start(){i=0;score=0;options=questions.map(q=>shuffle(q[1].map((t,k)=>({t,correct:k===q[2]}))));show()}function show(){selected=null;panel.innerHTML=`<small>FRAGE ${i+1} VON 5</small><progress max="5" value="${i+1}"></progress><h2>${questions[i][0]}</h2><div id="answers"></div><button id="next" class="primary" disabled>${i===4?'Ergebnis anzeigen':'Weiter'}</button>`;options[i].forEach((o,k)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+k)+'. '+o.t;b.setAttribute('aria-pressed','false');b.onclick=()=>{selected=k;document.querySelectorAll('#answers button').forEach((x,n)=>{x.classList.toggle('selected',n===k);x.setAttribute('aria-pressed',String(n===k))});document.getElementById('next').disabled=false};document.getElementById('answers').append(b)});document.getElementById('next').onclick=()=>{if(selected===null)return;score+=Number(options[i][selected].correct);i++;i===5?result():show()}}function result(){let level=score<=1?'Noob':score===2?'Casual':score<=4?'Pro':'Geek';let messages={Noob:'Du hast erste Grundkenntnisse zur IT-Sicherheit im Fahrzeug. Entdecke die wichtigsten Risiken und lerne, wie du dich schützen kannst.',Casual:'Du kennst bereits einige Sicherheitsrisiken im Fahrzeug. Vertiefe dein Wissen und entdecke weitere Schutzmaßnahmen.',Pro:'Du hast bereits gute Kenntnisse über Automotive IT-Sicherheit. Erweitere dein Wissen über komplexere Cyberrisiken.',Geek:'Du hast alle Fragen richtig beantwortet und zeigst sehr gute Kenntnisse über Automotive IT-Sicherheit. Entdecke weitere technische Herausforderungen.'};panel.innerHTML=`<small>DEIN ERGEBNIS</small><div class="level">${level}</div><strong>${score} von 5 Punkten</strong><p>${messages[level]}</p><p>Die QR-Codes im Fahrzeug sind mit den Schwierigkeitsgraden Noob, Casual, Pro und Geek gekennzeichnet. Du kannst jeden QR-Code scannen – unabhängig von deinem Ergebnis.</p><small>Geschätzter Wissensstand, keine offizielle Qualifikation.</small><button class="primary" onclick="start()">Quiz erneut starten</button>`}intro();</script></body></html>
